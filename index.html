<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shelves</title>
  <meta name="description" content="A cosy candlelit hall of bookshelves: books read and wished for, films, shows and songs, shared with friends.">
  <meta name="theme-color" content="#0b0907">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("shelves.theme") || "moonwood"; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="ambience" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="vignette"></div></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Back to the Hall">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c-1.2 2.4-3 3.8-3 6.2a3 3 0 0 0 6 0C19 5.8 17.2 4.4 16 2z" fill="#ffcf6e"/><rect x="13" y="11" width="6" height="13" fill="#e6dcc3"/><path d="M9 24h14l-2 3H11z" fill="#b08d57"/><rect x="7" y="27" width="18" height="2.5" fill="#7d6036"/></svg>
      <span id="brandName">Shelves</span>
    </a>
    <nav class="top-actions" id="topActions"></nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="color:#eee;padding:2rem;text-align:center">The Hall needs JavaScript to light its candles.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
